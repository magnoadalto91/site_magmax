<body>

<!-- fundo de circuito animado -->
<canvas id="circuitBg"></canvas>

<!-- grain overlay -->
<svg class="noise-defs" width="0" height="0">
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/></filter>
</svg>
<div class="grain" aria-hidden="true"></div>

<!-- preloader -->
<div class="preloader" id="preloader">
  <div class="preloader-planet">
    <img class="planet-img" src="assets/planeta.webp" alt="" width="754" height="694" />
    <img class="planet-logo" src="assets/Logo/icone.png" alt="Magmax Systems" width="256" height="256" />
  </div>
  <div class="preloader-bar"><span id="preloaderFill"></span></div>
  <button type="button" class="preloader-skip" id="preloaderSkip" data-cursor>Avançar &rarr;</button>
</div>

<!-- custom cursor -->
<div class="cursor-dot" id="cursorDot"></div>
<div class="cursor-ring" id="cursorRing"></div>

<main>

  <!-- ============ HERO — MURAL DISPERSO (página inteira) ============ -->
  <section class="scatter-hero" id="hero">

    <div class="scatter-field" id="scatterField">
      <a href="keyu.html" class="scatter-tile port real" data-cursor>
        <span class="tile-img"><img src="assets/keyu.webp" alt="Keyu" loading="lazy" /></span>
        <span class="tile-cap"><span class="tile-name">Keyu</span><span class="tile-desc">App gamificado</span></span>
      </a>
      <a class="scatter-tile land real soon">
        <span class="tile-img"><img src="assets/hero-bg.webp" alt="Captacione" loading="lazy" /><span class="card-wordmark">Captacione</span><span class="tile-soon">Em breve</span></span>
      </a>
      <a href="sobre.html" class="scatter-tile land" data-cursor>
        <span class="tile-img text-tile"><span class="tile-wordmark">Empresa</span></span>
        <span class="tile-cap"><span class="tile-name">Quem somos</span><span class="tile-desc">A empresa por trás</span></span>
      </a>
      <a href="contato.html" class="scatter-tile land" data-cursor>
        <span class="tile-img text-tile"><span class="tile-wordmark">Contato</span></span>
        <span class="tile-cap"><span class="tile-name">Contato</span><span class="tile-desc">Vamos conversar</span></span>
      </a>
      <a href="produtos.html" class="scatter-tile land" data-cursor>
        <span class="tile-img text-tile"><span class="tile-wordmark">Produtos</span></span>
        <span class="tile-cap"><span class="tile-name">Produtos</span><span class="tile-desc">Keyu &amp; Captacione</span></span>
      </a>
      <a href="servicos.html" class="scatter-tile land" data-cursor>
        <span class="tile-img text-tile"><span class="tile-wordmark">Serviços</span></span>
        <span class="tile-cap"><span class="tile-name">Serviços</span><span class="tile-desc">O que fazemos</span></span>
      </a>
    </div>

    <div class="scatter-center">
      <div class="scatter-title">
        <span class="st-main">MAGMAX <span class="st-sys">SYSTEMS</span></span>
        <span class="st-sub">ESTÚDIO DE SOFTWARE</span>
      </div>
    </div>

    <div class="scatter-corner">Magmax Systems&reg; — estúdio de software</div>
  </section>

</main>

<script src="js/circuit.js?v=3"></script>
<script src="js/main.js?v=3"></script>
</body>
</html>
